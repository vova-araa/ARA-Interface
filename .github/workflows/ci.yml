name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm-versie komt uit "packageManager" in package.json — hier niet dubbel opgeven
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm --filter @ara/shared test && pnpm --filter @ara/collector test

      - name: Build viewer
        run: pnpm --filter @ara/viewer build

      - name: Fixture + world map
        run: pnpm fixture && pnpm map

      - name: Install Playwright Chromium
        run: pnpm --filter @ara/viewer exec playwright install --with-deps chromium

      - name: Smoke tests (desktop + iPhone viewport)
        run: pnpm --filter @ara/viewer exec playwright test

      - name: Soak (accelerated, 3 sessions × 20s)
        run: |
          pnpm --filter @ara/collector start &
          sleep 3
          ARA_SOAK_SECONDS=20 pnpm soak
