# ARA World on Render — one web service: the collector serves the built viewer.
# Deploy: connect this repo in the Render dashboard (Blueprint) or `render blueprint launch`.
# Set ARA_TOKEN in the dashboard; then hooks post with X-ARA-Token and you open
# https://<service>.onrender.com/?token=<ARA_TOKEN> once (it persists in the browser).
services:
  - type: web
    name: ara-world
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @ara/viewer build && pnpm fixture && pnpm map
    startCommand: pnpm --filter @ara/collector start
    healthCheckPath: /health
    envVars:
      - key: ARA_TOKEN
        sync: false # set in dashboard — required: this instance is public
      - key: ARA_DATA_DIR
        value: /var/data
    disk:
      name: ara-data
      mountPath: /var/data
      sizeGB: 1
